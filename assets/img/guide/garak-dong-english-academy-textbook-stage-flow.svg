<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="교재는 학년이 아니라 씨앗, 잎사귀, 꽃, 열매 4단계로 올라간다. 단계는 나이가 아니라 학생 상태로 정한다. 중학생이어도 씨앗부터 다시 시작하는 경우가 있다. 레벨테스트는 상담 전이 아니라 등록 후 첫날 수업에서 본다."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0B0F16"/></linearGradient><radialGradient id="glow" cx="0.82" cy="0.18" r="0.55"><stop offset="0" stop-color="#C27A14" stop-opacity="0.14"/><stop offset="1" stop-color="#C27A14" stop-opacity="0"/></radialGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18202C"/><stop offset="1" stop-color="#121821"/></linearGradient></defs><rect width="960" height="400" fill="url(#bg)"/><rect width="960" height="400" fill="url(#glow)"/><g font-family="'Noto Sans KR',system-ui,sans-serif"><text x="56" y="56" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2.5" fill="#3DD6C4">학년이 아닌 4단계 교재</text><text x="56" y="96" font-size="30" font-weight="800" fill="#F1F4F8">씨앗 → 잎사귀 → 꽃 → 열매</text><text x="56" y="124" font-size="15" fill="#8A94A6">단계는 나이가 아니라 학생 상태로 정합니다</text><g><rect x="70" y="192" width="150" height="56" rx="28" fill="#2A2013" stroke="#6A4A17" stroke-width="1.5"/><text x="145" y="225" text-anchor="middle" font-size="19" font-weight="800" fill="#FFF3DE">씨앗</text><path d="M230 220 h42" stroke="#5D6878" stroke-width="2"/><path d="M272 214 l8 6 l-8 6" fill="none" stroke="#5D6878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="192" width="150" height="56" rx="28" fill="url(#card)" stroke="#1F9E90" stroke-width="1.5"/><text x="365" y="225" text-anchor="middle" font-size="19" font-weight="800" fill="#CFEFEA">잎사귀</text><path d="M450 220 h42" stroke="#5D6878" stroke-width="2"/><path d="M492 214 l8 6 l-8 6" fill="none" stroke="#5D6878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="510" y="192" width="150" height="56" rx="28" fill="url(#card)" stroke="#7C8AF2" stroke-width="1.5"/><text x="585" y="225" text-anchor="middle" font-size="19" font-weight="800" fill="#E3E6FD">꽃</text><path d="M670 220 h42" stroke="#5D6878" stroke-width="2"/><path d="M712 214 l8 6 l-8 6" fill="none" stroke="#5D6878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="730" y="192" width="150" height="56" rx="28" fill="url(#card)" stroke="#1F9E90" stroke-width="1.5"/><text x="805" y="225" text-anchor="middle" font-size="19" font-weight="800" fill="#CFEFEA">열매</text></g><text x="145" y="282" text-anchor="middle" font-size="12.5" fill="#C9A97A">중학생이어도 씨앗부터</text><text x="145" y="300" text-anchor="middle" font-size="12.5" fill="#C9A97A">다시 시작하는 경우가 있습니다</text><rect x="44" y="332" width="872" height="40" rx="12" fill="#141B25" stroke="#2A3544"/><text x="68" y="357" font-size="14" fill="#DCE3EC"><tspan fill="#3DD6C4" font-weight="700">확인할 것</tspan>  레벨테스트는 등록 후 첫날 수업에서 봅니다.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="지금 운영하는 반은 초등 4학년반, 초등 5~6학년반, 중등 내신반이고 모두 월·수·금 주 3회다. 초등 4학년반은 오후 2시에 시작해 130분 수업하고 오후 4시 10분에 끝난다. 초등 5~6학년반은 오후 3시에 시작해 150분 수업하고 오후 5시 30분 무렵 끝난다. 중등 내신반은 오후 4시에 시작해 160분 수업한다. 교습소 운영시간은 오후 2시부터 9시까지다."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0B0F16"/></linearGradient><radialGradient id="glow" cx="0.85" cy="0.15" r="0.5"><stop offset="0" stop-color="#1F9E90" stop-opacity="0.14"/><stop offset="1" stop-color="#1F9E90" stop-opacity="0"/></radialGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18202C"/><stop offset="1" stop-color="#121821"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter></defs><rect width="960" height="460" fill="url(#bg)"/><rect width="960" height="460" fill="url(#glow)"/><g font-family="'Noto Sans KR',system-ui,sans-serif"><text x="56" y="56" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2.5" fill="#3DD6C4">월·수·금 · 주 3회</text><text x="56" y="96" font-size="30" font-weight="800" fill="#F1F4F8">시간표가 맞지 않으면 나머지는 따질 것도 없습니다</text><text x="56" y="124" font-size="15" fill="#8A94A6">교습소 운영시간은 오후 2시부터 9시까지입니다</text><rect x="44" y="148" width="872" height="230" rx="16" fill="url(#card)" stroke="#263241" filter="url(#shadow)"/><g stroke="#223040" stroke-width="1"><line x1="240" y1="180" x2="240" y2="350"/><line x1="400" y1="180" x2="400" y2="350" stroke-dasharray="2 5"/><line x1="560" y1="180" x2="560" y2="350" stroke-dasharray="2 5"/><line x1="720" y1="180" x2="720" y2="350" stroke-dasharray="2 5"/><line x1="880" y1="180" x2="880" y2="350" stroke-dasharray="2 5"/></g><text x="64" y="217" font-size="15" font-weight="700" fill="#DCE3EC">초등 4학년반</text><rect x="240" y="198" width="520" height="26" rx="4" fill="#1F9E90" data-value="130" data-chart="classtime" data-orient="h"/><text x="252" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" fill="#07211D">오후 2시 시작 · 130분 · 오후 4시 10분 끝</text><text x="64" y="269" font-size="15" font-weight="700" fill="#DCE3EC">초등 5~6학년반</text><rect x="240" y="250" width="600" height="26" rx="4" fill="#7C8AF2" data-value="150" data-chart="classtime" data-orient="h"/><text x="252" y="268" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" fill="#101520">오후 3시 시작 · 150분 · 오후 5시 30분 무렵 끝</text><text x="64" y="322" font-size="15" font-weight="700" fill="#DCE3EC">중등 내신반</text><rect x="240" y="304" width="640" height="30" rx="4" fill="#C27A14" data-value="160" data-chart="classtime" data-orient="h"/><text x="252" y="324" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13.5" font-weight="800" fill="#1A140C">오후 4시 시작 · 160분</text><g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#5D6878" text-anchor="middle"><text data-axis="classtime" x="240" y="366">0</text><text data-axis="classtime" x="400" y="366">40</text><text data-axis="classtime" x="560" y="366">80</text><text data-axis="classtime" x="720" y="366">120</text><text data-axis="classtime" x="880" y="366">160분</text></g><rect x="44" y="396" width="872" height="40" rx="12" fill="#141B25" stroke="#2A3544"/><text x="68" y="421" font-size="14" fill="#DCE3EC"><tspan fill="#3DD6C4" font-weight="700">확인할 것</tspan>  아이 하교 시간과 수업 시작 시간이 맞는지부터 보세요.</text></g></svg>
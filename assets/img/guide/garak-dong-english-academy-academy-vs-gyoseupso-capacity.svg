<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="학원과 교습소는 인원 기준으로 갈린다. 학원은 같은 시간 10명부터이고 교습소는 9명 이하까지다. 저희가 교육청에 신고한 반 정원은 7명이다. 신고 정원은 상한선이므로 그 시간대 실제 인원은 상담에서 확인해야 한다."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0B0F16"/></linearGradient><radialGradient id="glow" cx="0.85" cy="0.15" r="0.5"><stop offset="0" stop-color="#7C8AF2" stop-opacity="0.14"/><stop offset="1" stop-color="#7C8AF2" stop-opacity="0"/></radialGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18202C"/><stop offset="1" stop-color="#121821"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter></defs><rect width="960" height="460" fill="url(#bg)"/><rect width="960" height="460" fill="url(#glow)"/><g font-family="'Noto Sans KR',system-ui,sans-serif"><text x="56" y="56" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" letter-spacing="2.5" fill="#3DD6C4">학원·교습소 인원 기준</text><text x="56" y="96" font-size="30" font-weight="800" fill="#F1F4F8">학원과 교습소는 인원에서 갈립니다</text><text x="56" y="124" font-size="15" fill="#8A94A6">법이 정한 인원과 신고한 정원은 다릅니다</text><rect x="44" y="148" width="872" height="230" rx="16" fill="url(#card)" stroke="#263241" filter="url(#shadow)"/><g stroke="#223040" stroke-width="1"><line x1="300" y1="180" x2="300" y2="350"/><line x1="408" y1="180" x2="408" y2="350" stroke-dasharray="2 5"/><line x1="516" y1="180" x2="516" y2="350" stroke-dasharray="2 5"/><line x1="624" y1="180" x2="624" y2="350" stroke-dasharray="2 5"/><line x1="732" y1="180" x2="732" y2="350" stroke-dasharray="2 5"/><line x1="840" y1="180" x2="840" y2="350" stroke-dasharray="2 5"/></g><text x="64" y="217" font-size="15" font-weight="700" fill="#DCE3EC">학원</text><rect x="300" y="198" width="540" height="26" rx="4" fill="#7C8AF2" data-value="10" data-chart="capacity" data-orient="h"/><text x="312" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#101520">10명 — 학원 기준</text><text x="64" y="269" font-size="15" font-weight="700" fill="#DCE3EC">교습소</text><rect x="300" y="250" width="486" height="26" rx="4" fill="#1F9E90" data-value="9" data-chart="capacity" data-orient="h"/><text x="312" y="268" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#07211D">9명 이하 — 법정 상한</text><text x="64" y="320" font-size="15" font-weight="800" fill="#FFE9C7">신고 정원</text><text x="64" y="338" font-size="12.5" fill="#C9A97A">(저희)</text><rect x="300" y="304" width="378" height="30" rx="4" fill="#C27A14" data-value="7" data-chart="capacity" data-orient="h"/><text x="312" y="324" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="800" fill="#1A140C">7명 — 신고 정원</text><g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#5D6878" text-anchor="middle"><text data-axis="capacity" x="300" y="366">0</text><text data-axis="capacity" x="408" y="366">2</text><text data-axis="capacity" x="516" y="366">4</text><text data-axis="capacity" x="624" y="366">6</text><text data-axis="capacity" x="732" y="366">8</text><text data-axis="capacity" x="840" y="366">10명</text></g><rect x="44" y="396" width="872" height="40" rx="12" fill="#141B25" stroke="#2A3544"/><text x="68" y="421" font-size="14" fill="#DCE3EC"><tspan fill="#3DD6C4" font-weight="700">확인할 것</tspan>  신고 정원은 상한선입니다. 그 시간대 실제 인원은 상담에서 확인하세요.</text></g></svg>